<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        const path = window.location.pathname;
        let number = path.substring(1).replace(/\.html$/, '').replace(/\//g, '');
        number = number.replace(/[^0-9]/g, '');
        
        if (number && number.length > 3) {
            window.location.replace(`https://call-charges.co.uk/#check=${number}`);
        } else {
            window.location.replace('https://call-charges.co.uk/');
        }
    </script>
</head>
<body>Loading...</body>
</html>
